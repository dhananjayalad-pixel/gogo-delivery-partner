
name: GO GO Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip GO_GO_Delivery_Partner_Source.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle -p GO_GO_Delivery_Partner assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GO-GO-Delivery-APK
          path: GO_GO_Delivery_Partner/app/build/outputs/apk/debug/app-debug.apk
          
